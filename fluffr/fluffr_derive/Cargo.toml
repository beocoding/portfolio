[package]
name = "fluffr_derive"
version = "0.2.0"
edition = "2021"
license = "LicenseRef-Proprietary"
description = "derive macros for fluffr"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.2", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
# `path` is used for local builds; `cargo publish` strips it automatically
# and ships the `version` requirement instead, so this works unmodified in
# both local dev and on crates.io.
fluffr_core = { path = "../fluffr_core", version = "0.2.0" }

